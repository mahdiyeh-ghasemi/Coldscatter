[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "coldscatter"
version = "0.1.0.dev0"
description = "Coupled-channel scattering for ultracold atoms and molecules, in pure Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.22", "scipy>=1.8"]
keywords = ["ultracold", "scattering", "Feshbach resonance", "coupled channels", "AMO physics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = ["pytest"]
examples = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
